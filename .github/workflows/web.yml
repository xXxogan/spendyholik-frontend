name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: spendyholik-web-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Flutter 3.47.7
        run: |
          git clone --quiet --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Generate and verify
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build the Web image
        run: |
          flutter build web --release --no-pub --no-web-resources-cdn
          test ! -e build/web/assets/assets/legal/privacy_policy_ru.md
          test ! -e build/web/privacy-policy.md
          printf '%s\n' "$GITHUB_SHA" > build/web/deploy-revision.txt
          docker build --platform linux/amd64 -f deploy/web/Dockerfile -t "spendyholik-web:$GITHUB_SHA" .

      - name: Deploy to k3s
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_SSH_HOST: ${{ vars.WEB_SSH_HOST }}
          WEB_SSH_KNOWN_HOSTS: ${{ vars.WEB_SSH_KNOWN_HOSTS }}
          WEB_SSH_KEY: ${{ secrets.WEB_SSH_KEY }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit reached main. Skipping this release.'
            exit 0
          fi
          : "${WEB_SSH_HOST:?Set the WEB_SSH_HOST repository variable}"
          : "${WEB_SSH_KNOWN_HOSTS:?Set the WEB_SSH_KNOWN_HOSTS repository variable}"
          : "${WEB_SSH_KEY:?Set the WEB_SSH_KEY repository secret}"

          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/spendyholik-key.XXXXXX")
          hosts_file=$(mktemp "$RUNNER_TEMP/spendyholik-hosts.XXXXXX")
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$WEB_SSH_KEY" > "$key_file"
          printf '%s\n' "$WEB_SSH_KNOWN_HOSTS" > "$hosts_file"
          unset WEB_SSH_KEY

          docker save "spendyholik-web:$GITHUB_SHA" | gzip -1 | ssh -T \
            -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 "root@$WEB_SSH_HOST" "deploy $GITHUB_SHA"
